<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturelle Certificate – Botanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e6e9e1;font-family:'Montserrat',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.panel{max-width:1123px;margin:18px auto 0;padding:14px 16px;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.08);display:grid;grid-template-columns:2fr 1fr 1.6fr 1.6fr 1fr auto;gap:10px;align-items:end}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:#1f5a34;text-transform:uppercase;letter-spacing:.5px}
.panel input,.panel select{font:500 14px 'Montserrat',sans-serif;padding:8px 10px;border:1.5px solid #c9dcb8;border-radius:8px;background:#fbfdf8;color:#1b2a5c;outline:none}
.panel input:focus,.panel select:focus{border-color:#4e9a3e}
.panel button{font:700 14px 'Montserrat',sans-serif;padding:10px 18px;border:0;border-radius:8px;background:#1f5a34;color:#fff;cursor:pointer}
.panel button:hover{background:#163f25}
@media (max-width:820px){.panel{grid-template-columns:1fr 1fr;margin:12px}}
.stage{display:flex;justify-content:center;padding:18px 0 40px}
.fit{position:relative}
.page{width:297mm;height:210mm;background:#fdfaf0;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden;transform-origin:top left;position:absolute;top:0;left:0}
.page svg{display:block;width:100%;height:100%}
.f-cin{font-family:'Cinzel',Georgia,serif}
.f-hd{font-family:'Playfair Display',Georgia,serif}
.f-sans{font-family:'Montserrat',Arial,sans-serif}
.f-body{font-family:'Crimson Pro',Georgia,serif}
.f-script{font-family:'Great Vibes',cursive}
@media print{
  html,body{background:none}
  .panel{display:none}
  .stage{padding:0;display:block}
  .fit{width:297mm!important;height:210mm!important}
  .page{transform:none!important;box-shadow:none;position:static}
}
</style>
</head>
<body>

<div class="panel">
  <label>Student Name<input id="iName" placeholder="Leave blank for template"></label>
  <label>Class / Division<select id="iDiv"></select></label>
  <label>Team / Group<input id="iTeam" placeholder="Team name"></label>
  <label>Category<select id="iCat">
    <option>Best Presentation</option>
    <option>Best Soap Quality</option>
    <option>Best Entrepreneurship</option>
    <option>Best Stall</option>
    <option>Participation</option>
  </select></label>
  <label>Position<select id="iPos"><option value="">—</option><option>1st</option><option>2nd</option><option>3rd</option></select></label>
  <button onclick="window.print()">Print / PDF</button>
</div>

<div class="stage">
<div class="fit" id="fit">
<div class="page" id="page">
<svg viewBox="0 0 1491 1055" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3d98a"/><stop offset=".4" stop-color="#c99a35"/><stop offset=".65" stop-color="#f0cf78"/><stop offset="1" stop-color="#a97a22"/>
  </linearGradient>
  <radialGradient id="gPaper" cx=".5" cy=".5" r=".72">
    <stop offset="0" stop-color="#fffdf6"/><stop offset=".75" stop-color="#fbf6e6"/><stop offset="1" stop-color="#f1ead2"/>
  </radialGradient>
  <radialGradient id="gWash">
    <stop offset="0" stop-color="#9ccb83" stop-opacity=".55"/><stop offset="1" stop-color="#9ccb83" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gSeal" cx=".4" cy=".35" r=".75">
    <stop offset="0" stop-color="#fff0b0"/><stop offset=".45" stop-color="#eac155"/><stop offset="1" stop-color="#a77720"/>
  </radialGradient>
  <linearGradient id="gPill" x1="0" x2="1">
    <stop offset="0" stop-color="#1f5a34"/><stop offset=".5" stop-color="#2d7445"/><stop offset="1" stop-color="#1f5a34"/>
  </linearGradient>
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .2  0 0 0 .09 0"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#23331a" flood-opacity=".25"/></filter>
  <path id="sealTop" d="M1213,858 A62,62 0 0 1 1337,858"/>
  <g id="corner">
    <path d="M0,70 C0,30 30,0 70,0" fill="none" stroke="url(#gGold)" stroke-width="2.5"/>
    <path d="M14,92 C10,50 50,10 92,14" fill="none" stroke="url(#gGold)" stroke-width="1.4"/>
    <path d="M28,58 c-6,-18 12,-34 30,-28 c-12,2 -18,12 -14,22 c-6,-4 -12,0 -16,6z" fill="#c99a35"/>
    <circle cx="22" cy="22" r="5" fill="#c99a35"/>
    <path d="M0,110 l6,10 l-6,10 l-6,-10z M110,0 l10,6 l10,-6 l-10,-6z" fill="#c99a35"/>
  </g>
</defs>

<!-- paper -->
<rect width="1491" height="1055" fill="url(#gPaper)"/>
<rect width="1491" height="1055" filter="url(#paper)"/>
<g filter="url(#soft)">
  <ellipse cx="110" cy="110" rx="260" ry="200" fill="url(#gWash)"/>
  <ellipse cx="1390" cy="950" rx="290" ry="210" fill="url(#gWash)"/>
  <ellipse cx="150" cy="960" rx="230" ry="150" fill="url(#gWash)" opacity=".8"/>
  <ellipse cx="1380" cy="110" rx="200" ry="140" fill="url(#gWash)" opacity=".7"/>
</g>

<!-- border -->
<rect x="18" y="18" width="1455" height="1019" fill="none" stroke="#1f5a34" stroke-width="20"/>
<rect x="34" y="34" width="1423" height="987" fill="none" stroke="url(#gGold)" stroke-width="3"/>
<rect x="48" y="48" width="1395" height="959" fill="none" stroke="url(#gGold)" stroke-width="1.2"/>
<g id="dotsBorder"></g>
<use href="#corner" transform="translate(58,58)"/>
<use href="#corner" transform="translate(1433,58) scale(-1,1)"/>
<use href="#corner" transform="translate(58,997) scale(1,-1)"/>
<use href="#corner" transform="translate(1433,997) scale(-1,-1)"/>

<script>
(function(){

let seed=23;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pal=['#2f7d32','#3f9142','#56a845','#6fb84f','#2a6b2e','#4d9a3a','#86c35f','#3c8a3c'];
function leaf(g,x,y,ang,len,w,col){
  col=col||pal[Math.floor(rnd()*pal.length)];
  const t=el('g',{transform:`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${ang.toFixed(1)})`},g);
  el('path',{d:`M0,0 C${len*.22},${-w*1.1} ${len*.68},${-w} ${len},0 C${len*.68},${w} ${len*.22},${w*1.1} 0,0Z`,fill:col},t);
  el('path',{d:`M0,0 C${len*.22},${w*1.1} ${len*.68},${w} ${len},0 Q${len*.5},${w*.15} 0,0Z`,fill:'#1d4f1f',opacity:.22},t);
  el('path',{d:`M${len*.04},0 Q${len*.5},${-w*.08} ${len*.92},0`,stroke:'#e8f5d0','stroke-width':Math.max(.8,len/45),fill:'none',opacity:.6},t);
}
function branch(g,x,y,ang,len,n,size,bend){
  const r=Math.PI/180,a=ang*r;
  const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;
  const mx=(x+ex)/2+Math.cos(a+Math.PI/2)*bend,my=(y+ey)/2+Math.sin(a+Math.PI/2)*bend;
  el('path',{d:`M${x},${y} Q${mx},${my} ${ex},${ey}`,stroke:'#557d33','stroke-width':2.2,fill:'none','stroke-linecap':'round'},g);
  for(let i=1;i<=n;i++){
    const t=i/(n+.6);
    const px=(1-t)**2*x+2*(1-t)*t*mx+t*t*ex,py=(1-t)**2*y+2*(1-t)*t*my+t*t*ey;

function soap(g,x,y,w,h,d,c){
  const dx=d,dy=-d*.75;
  el('path',{d:`M${x},${y} L${x+dx},${y+dy} L${x+w+dx},${y+dy} L${x+w},${y} Z`,fill:c[1],stroke:c[3],'stroke-width':1},g);
  el('path',{d:`M${x+w},${y} L${x+w+dx},${y+dy} L${x+w+dx},${y+h+dy} L${x+w},${y+h} Z`,fill:c[2],stroke:c[3],'stroke-width':1},g);
  el('rect',{x,y,width:w,height:h,fill:c[0],stroke:c[3],'stroke-width':1,rx:2},g);
  for(let i=0;i<Math.round(w/10);i++)el('circle',{cx:x+4+rnd()*(w-8),cy:y+4+rnd()*(h-8),r:.8+rnd()*1.2,fill:c[3],opacity:.35},g);
}
function twine(g,x,y,w,h,d){
  const dx=d,dy=-d*.75,s={stroke:'#a87b4a','stroke-width':2.2,fill:'none'};
  el('line',Object.assign({x1:x+w/2,y1:y,x2:x+w/2,y2:y+h},s),g);
  el('line',Object.assign({x1:x+w/2,y1:y,x2:x+w/2+dx,y2:y+dy},s),g);
  el('line',Object.assign({x1:x+dx/2,y1:y+dy/2,x2:x+w+dx/2,y2:y+dy/2},s),g);
  const bx=x+w/2+dx/2,by=y+dy/2;
  el('ellipse',Object.assign({cx:bx-6,cy:by-4,rx:6,ry:3.5,transform:`rotate(-20 ${bx-6} ${by-4})`},s),g);
  el('ellipse',Object.assign({cx:bx+6,cy:by-4,rx:6,ry:3.5,transform:`rotate(20 ${bx+6} ${by-4})`},s),g);
}

const sel=$('iDiv');sel.appendChild(new Option('—',''));

function fit(id,max){const t=$(id);t.removeAttribute('textLength');t.removeAttribute('lengthAdjust');
  try{if(t.getComputedTextLength()>max){t.setAttribute('textLength',max);t.setAttribute('lengthAdjust','spacingAndGlyphs');}}catch(e){}}
function update(){
  const pos=$('iPos').value;
  $('tName').textContent=$('iName').value;
  $('tDiv').textContent=$('iDiv').value;
  $('tTeam').textContent=$('iTeam').value;
  const cat=$('iCat').value, part=cat==='Participation';
  $('iPos').disabled=part;
  const l1=$('tL1');l1.textContent='';
  const add=(t,b)=>{const ts=document.createElementNS(NS,'tspan');ts.textContent=t;if(b){ts.setAttribute('font-weight','700');ts.setAttribute('fill','#1f5a34');}l1.appendChild(ts);};
  if(part){add('for ');add('active participation',1);add(' and valuable contribution');}
  else{add('for securing ');add(pos||'________',1);add(' place in the ');add(cat,1);add(' category');}
  $('tSub').textContent=part?'of Participation':'of Excellence';
  $('sealPos').textContent=part?'★':(pos||'★');
  $('sealPos').setAttribute('font-size',part||!pos?'42':'42');
  $('sealLbl').textContent=part?'PARTICIPANT':'WINNER';
  fit('tName',620);fit('tTeam',144);fit('tDiv',128);
}
['iName','iDiv','iTeam','iCat','iPos'].forEach(id=>{$(id).addEventListener('input',update);$(id).addEventListener('change',update);});
function scale(){
  const page=$('page'),f=$('fit');
  page.style.transform='none';
  const w=page.offsetWidth,h=page.offsetHeight;
  const s=Math.min(1,(window.innerWidth-32)/w);
  page.style.transform=`scale(${s})`;
  f.style.width=w*s+'px';f.style.height=h*s+'px';
}
window.addEventListener('resize',scale);
scale();update();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{update();scale();});
})();
